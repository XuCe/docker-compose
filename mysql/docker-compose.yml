services:
  mysql8.0:
    # 镜像名
    image: mysql:lts
    # 容器名(以后的控制都通过这个)
    container_name: mysql8
    # 重启策略
    restart: always
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: dlf%p!asdja&a#t%f
      # 映射端口
    ports:
      - 3306:3306
    volumes:
      # 数据挂载
      - /data/:/var/lib/mysql/
      # 配置挂载
      - ./conf/:/etc/mysql/conf.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
